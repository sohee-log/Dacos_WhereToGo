# CI — 시크릿 스캔 + 프론트 lint/build (ROLE_C C1-2 / C1-6)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # 레포가 public이므로 이 잡이 먼저다. 프리커밋 훅은 각자 설치해야 돌지만
  # 이 잡은 우회할 수 없다. 실질적인 시크릿 게이트다.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 히스토리 스캔에 필요

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # 현재 트리 — 여기서 걸리면 머지를 막는다.
      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      # 과거 커밋 — 2026-08-10 기준 전수 스캔이 깨끗해서 blocking으로 둔다.
      # 브랜치 안에서 시크릿을 넣었다가 지운 경우는 위 스캔이 못 잡고 여기서 잡힌다.
      # 여기서 걸리면 파일을 지우는 것으로 끝나지 않는다 — 키를 폐기·재발급하고
      # 히스토리를 정리한 뒤, 불가피한 오탐이면 .gitleaks.toml 의 commits 에 근거와 함께 추가한다.
      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner

  # roleB는 지금까지 CI에서 한 번도 안 돌았다. 로컬에서만 돌던 316건이
  # 실제로는 게이트가 아니었다는 뜻이다 — 계약 테스트를 늘려 놓고 CI에 안 걸면
  # 형태가 바뀌었을 때 아무도 모른다 (docs/LLM_QUOTA.md §0의 사고가 그랬다).
  api:
    name: roleB tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roleB
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # Render와 같은 버전으로 맞춘다
          cache: pip
          cache-dependency-path: roleB/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # 네트워크·DB가 필요한 테스트는 스스로 skip한다(TEST_DATABASE_URL 없음).
      # 여기서 도는 것은 순수 로직과 계약 테스트다.
      - name: Test
        run: pytest -q

      # roleC/lib/api-types.ts는 openapi.yaml에서 생성한다. openapi만 고치고
      # 생성기를 안 돌리면 C의 타입이 조용히 낡는다 — 손으로 베껴 쓰던 시절
      # POST /api/feedback이 몇 주 동안 422였다(BRIEF 2026-08-28 §1).
      # pytest에도 같은 대조가 있지만, 실패 원인이 한 줄로 보이게 따로 둔다.
      - name: TS contract in sync
        run: python -m tools.gen_ts_types --check

  web:
    name: roleC lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roleC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: roleC/package-lock.json

      # npm install이 아니라 npm ci — 락파일 그대로 재현해야 CI가 의미를 갖는다.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
