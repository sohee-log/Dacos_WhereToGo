# CI — 시크릿 스캔 + 프론트 lint/build (ROLE_C C1-2 / C1-6)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # 레포가 public이므로 이 잡이 먼저다. 프리커밋 훅은 각자 설치해야 돌지만
  # 이 잡은 우회할 수 없다. 실질적인 시크릿 게이트다.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 히스토리 스캔에 필요

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # 현재 트리 — 여기서 걸리면 머지를 막는다.
      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      # 과거 커밋 — 2026-08-10 기준 전수 스캔이 깨끗해서 blocking으로 둔다.
      # 브랜치 안에서 시크릿을 넣었다가 지운 경우는 위 스캔이 못 잡고 여기서 잡힌다.
      # 여기서 걸리면 파일을 지우는 것으로 끝나지 않는다 — 키를 폐기·재발급하고
      # 히스토리를 정리한 뒤, 불가피한 오탐이면 .gitleaks.toml 의 commits 에 근거와 함께 추가한다.
      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner

  web:
    name: roleC lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roleC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: roleC/package-lock.json

      # npm install이 아니라 npm ci — 락파일 그대로 재현해야 CI가 의미를 갖는다.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
