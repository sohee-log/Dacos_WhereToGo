# .github/workflows/ci.yml
name: C1-6 CI Workflow (Lint + Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20'
        cache: 'npm'
        cache-dependency-path: roleC/package.json

    - name: Install dependencies
      run: |
        cd roleC
        npm list || npm install

    - name: Next.js Lint and Build Test
      run: |
        cd roleC
        npm run build